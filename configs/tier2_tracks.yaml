# Config for: Phase 4 Tier 2 Tracks (Pareto Frontier & Operating Curves)
# Run with: make exp-tier2

extends: experiment_base.yaml

experiment:
  name: "tier2_tracks"
  description: >
    Pareto curve evaluation for application-layer deep verification:
    Track A: HTTP Payloads (CSIC 2010 Dataset) with char n-gram deep verification.
    Track B: Static PE Binaries (EMBER 2018 Static PE Dataset) with full byte histogram/entropy.
    Sweeps escalation budgets from 0% to 100% to map Accuracy and Silent-Failure Rate (SFR)
    against Escalation Rate (%) and Mean/Blended Latency (ms), identifying the exact budget
    at which Two-Tier matches Tier-2-only accuracy.
  seeds: [42, 71, 137, 256, 512]
  output_dir: "results/tier2_tracks"

budgets:
  - 0.00
  - 0.01
  - 0.02
  - 0.03
  - 0.05
  - 0.08
  - 0.10
  - 0.15
  - 0.20
  - 0.25
  - 0.30
  - 0.40
  - 0.50
  - 0.60
  - 0.70
  - 0.80
  - 0.90
  - 1.00

track_a:
  dataset_path: "/Users/sohamsupekar/Desktop/MajorProject/DATASET/csic_database.csv"
  max_samples: 8000
  n_features_deep: 1500
  tier1:
    n_estimators: 30
    max_depth: 6
  tier2:
    n_estimators: 100
    max_depth: 12

track_b:
  dataset_path: "data/generated/tier2_real_corpus.jsonl"
  max_samples: 5000
  tier1:
    n_estimators: 30
    max_depth: 6
  tier2:
    n_estimators: 120
    max_depth: 16
