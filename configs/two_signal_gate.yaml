# Config for: Two-Signal Escalation Gate with Split-Conformal Calibration
# Run with: make exp-two-signal

extends: experiment_base.yaml

experiment:
  name: "two_signal_gate"
  description: >
    Comprehensive evaluation of Two-Signal Escalation Gates combining discriminative
    uncertainty with benign-only novelty detectors (Isolation Forest, Mahalanobis, kNN, Autoencoder)
    calibrated with split-conformal prediction at fixed escalation budgets (1%, 5%, 10%).
    Compared against Round 2 baselines on Silent-Failure Rate (SFR), Balanced Accuracy,
    Per-Family Recalls, FPR, and Latency.
  seeds: [42, 71, 137, 256, 512]
  output_dir: "results/two_signal_gate"

budgets:
  - 0.01  # 1% escalation budget
  - 0.05  # 5% escalation budget
  - 0.10  # 10% escalation budget

novelty_detectors:
  - "isolation_forest"
  - "mahalanobis"
  - "knn"
  - "autoencoder"

tier1:
  n_estimators: 40
  max_depth: 6

tier2:
  n_estimators: 250
  max_depth: null

autoencoder:
  hidden_dim: 16
  bottleneck_dim: 8
  epochs: 25
  batch_size: 128
  lr: 0.005
