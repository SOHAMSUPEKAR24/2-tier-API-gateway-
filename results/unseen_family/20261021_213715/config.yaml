experiment:
  description: "Comprehensive open-set benchmark evaluating two operational regimes:\
    \ A. Known-families regime: Leave-One-Family-Out (LOFO) across all 5 families\n\
    \   (FTP-BruteForce, SSH-BruteForce, DoS-GoldenEye, DoS-Hulk, DoS-Slowloris).\n\
    B. Cold-start stress test: FTP-only trained protocol against novel families. Includes\
    \ feature ablation (9 vs 25 vs 76 allowlisted features), realistic prevalence\
    \ (1:100, 1:1000), balanced accuracy, per-family recalls, FPR, SFR, ER, and Tier-2-only\
    \ baselines.\n"
  name: unseen_family
  output_dir: results/unseen_family
  seeds:
  - 42
  - 71
  - 137
  - 256
  - 512
extends: experiment_base.yaml
families:
- FTP-BruteForce
- SSH-BruteForce
- DoS-GoldenEye
- DoS-Hulk
- DoS-Slowloris
feature_ablation_sets:
- 9
- 25
- 76
prevalence_ratios:
- 1:100
- 1:1000
tier1:
  escalation_band:
  - 0.3
  - 0.7
  max_depth: 6
  n_estimators: 40
tier2:
  max_depth: null
  n_estimators: 250
