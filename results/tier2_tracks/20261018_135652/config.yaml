experiment:
  description: 'Pareto curve evaluation for application-layer deep verification: Track
    A: HTTP Payloads (CSIC 2010 Dataset) with char n-gram deep verification. Track
    B: Static PE Binaries (EMBER 2018 Static PE Dataset) with full byte histogram/entropy.
    Sweeps escalation budgets from 0% to 100% to map Accuracy and Silent-Failure Rate
    (SFR) against Escalation Rate (%) and Mean/Blended Latency (ms), identifying the
    exact budget at which Two-Tier matches Tier-2-only accuracy.

    '
  name: tier2_tracks
  output_dir: results/tier2_tracks
  seeds:
  - 42
  - 71
  - 137
  - 256
  - 512
extends: experiment_base.yaml
